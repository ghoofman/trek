# Waitlist rate limit, per visitor. Behind cloudflared every request comes from the
# tunnel's address, so key on the visitor IP Cloudflare passes along.
map $http_cf_connecting_ip $waitlist_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $waitlist_client zone=waitlist:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind cloudflared: keep redirects (e.g. /compare/t3-code -> /compare/t3-code/) relative.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mobile waitlist sign-ups, handled by the waitlist container. Resolving the name
    # per request (Docker's DNS) keeps the site up even when that container isn't.
    location = /api/waitlist {
        limit_req zone=waitlist burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $waitlist_upstream http://waitlist:3000;
        proxy_pass $waitlist_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images and the topo map rarely change; cache them for a week.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML, CSS and JS revalidate on every load so a redeploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }
}
